name: Validate workflows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Contracts and actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Contract tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate GitHub Actions syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca

      - name: Reject whitespace errors
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git diff --check "$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"..HEAD
