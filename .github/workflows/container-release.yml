name: Container release

on:
  workflow_call:
    inputs:
      namespace:
        description: GHCR organization or user namespace
        type: string
        required: true
      images:
        description: JSON matrix describing product-owned image contracts
        type: string
        required: true
    secrets:
      registry_token:
        description: Optional registry token; defaults to the workflow token
        required: false
      package_read_token:
        description: Optional package token exposed as BuildKit secret PACKAGE_READ_TOKEN
        required: false
      application_build_secret:
        description: Optional application secret exposed as BuildKit secret APPLICATION_BUILD_SECRET
        required: false
      public_build_arg_1:
        description: Optional public value exposed as REUSABLE_PUBLIC_BUILD_ARG_1
        required: false
      public_build_arg_2:
        description: Optional public value exposed as REUSABLE_PUBLIC_BUILD_ARG_2
        required: false
      public_build_arg_3:
        description: Optional public value exposed as REUSABLE_PUBLIC_BUILD_ARG_3
        required: false
      public_build_arg_4:
        description: Optional public value exposed as REUSABLE_PUBLIC_BUILD_ARG_4
        required: false
      public_build_arg_5:
        description: Optional public value exposed as REUSABLE_PUBLIC_BUILD_ARG_5
        required: false
      public_build_arg_6:
        description: Optional public value exposed as REUSABLE_PUBLIC_BUILD_ARG_6
        required: false
      public_build_arg_7:
        description: Optional public value exposed as REUSABLE_PUBLIC_BUILD_ARG_7
        required: false
      public_build_arg_8:
        description: Optional public value exposed as REUSABLE_PUBLIC_BUILD_ARG_8
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release-guard:
    name: Main branch release
    runs-on: ubuntu-latest
    steps:
      - name: Refuse releases outside main
        env:
          NAMESPACE: ${{ inputs.namespace }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          test "$RELEASE_REF" = refs/heads/main
          [[ "$NAMESPACE" =~ ^[a-z0-9][a-z0-9._-]*$ ]]

  publish:
    name: Publish — ${{ matrix.name }}
    needs: release-guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token || github.token }}

      - name: Validate image contract
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_TARGET: ${{ matrix.target }}
          SOURCE_ROOT: ${{ matrix.source_root }}
          SMOKE_PATH: ${{ matrix.smoke_path }}
          SMOKE_PORT: ${{ matrix.smoke_port }}
          TRIVY_IGNORE_FILE: ${{ matrix.trivy_ignore_file }}
        run: |
          [[ "$IMAGE_NAME" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          [[ -z "$IMAGE_TARGET" || "$IMAGE_TARGET" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]
          [[ -z "$SOURCE_ROOT" || "$SOURCE_ROOT" != *[[:space:]]* ]]
          [[ "$SMOKE_PORT" =~ ^[0-9]+$ ]]
          [[ "$SMOKE_PATH" == /* && "$SMOKE_PATH" != *[[:space:]]* ]]
          [[ -z "$TRIVY_IGNORE_FILE" || -f "$TRIVY_IGNORE_FILE" ]]

      - name: Prepare protected build inputs
        id: build-inputs
        env:
          APPLICATION_BUILD_SECRET: ${{ secrets.application_build_secret }}
          REQUIRES_APPLICATION_BUILD_SECRET: ${{ matrix.requires_application_build_secret == true }}
        run: |
          if [[ "$REQUIRES_APPLICATION_BUILD_SECRET" == "true" && -z "$APPLICATION_BUILD_SECRET" ]]; then
            echo "::error::Required application build secret is not configured"
            exit 1
          fi
          if [[ -n "$APPLICATION_BUILD_SECRET" ]]; then
            fingerprint=$(printf '%s' "$APPLICATION_BUILD_SECRET" | sha256sum | cut -c1-16)
          else
            fingerprint=none
          fi
          echo "secret_fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build, attest, and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          build-args: |
            ${{ matrix.build_args }}
            REUSABLE_BUILD_CACHE_FP=${{ steps.build-inputs.outputs.secret_fingerprint }}
            REUSABLE_PUBLIC_BUILD_ARG_1=${{ secrets.public_build_arg_1 }}
            REUSABLE_PUBLIC_BUILD_ARG_2=${{ secrets.public_build_arg_2 }}
            REUSABLE_PUBLIC_BUILD_ARG_3=${{ secrets.public_build_arg_3 }}
            REUSABLE_PUBLIC_BUILD_ARG_4=${{ secrets.public_build_arg_4 }}
            REUSABLE_PUBLIC_BUILD_ARG_5=${{ secrets.public_build_arg_5 }}
            REUSABLE_PUBLIC_BUILD_ARG_6=${{ secrets.public_build_arg_6 }}
            REUSABLE_PUBLIC_BUILD_ARG_7=${{ secrets.public_build_arg_7 }}
            REUSABLE_PUBLIC_BUILD_ARG_8=${{ secrets.public_build_arg_8 }}
          secrets: |
            PACKAGE_READ_TOKEN=${{ secrets.package_read_token }}
            APPLICATION_BUILD_SECRET=${{ secrets.application_build_secret }}
          tags: |
            ghcr.io/${{ inputs.namespace }}/${{ matrix.name }}:main-${{ steps.sha.outputs.short }}
            ghcr.io/${{ inputs.namespace }}/${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.name }}
            dev.tesserix.source.root=${{ matrix.source_root }}
          cache-from: type=gha,scope=main-${{ matrix.name }}
          cache-to: type=gha,scope=main-${{ matrix.name }},mode=max
          sbom: true
          provenance: mode=max

      - name: Smoke test published image
        if: ${{ matrix.smoke_port != 0 }}
        env:
          IMAGE_REF: ghcr.io/${{ inputs.namespace }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          SMOKE_PATH: ${{ matrix.smoke_path }}
          SMOKE_PORT: ${{ matrix.smoke_port }}
        run: |
          docker pull "$IMAGE_REF"
          container_id=$(docker run --detach --rm --publish "$SMOKE_PORT:$SMOKE_PORT" "$IMAGE_REF")
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 1 \
            --retry-max-time 30 --fail --silent --show-error --output /dev/null \
            "http://127.0.0.1:${SMOKE_PORT}${SMOKE_PATH}"

      - name: Scan published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ inputs.namespace }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: ${{ matrix.trivy_ignore_file }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ inputs.namespace }}/${{ matrix.name }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
