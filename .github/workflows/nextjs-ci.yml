name: Next.js CI

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory containing package.json and package-lock.json
        type: string
        default: .
      node_version:
        description: Node.js runtime version
        type: string
        default: "22"
      legacy_peer_dependencies:
        description: Install the locked dependency tree using legacy peer resolution
        type: boolean
        default: false
      audit_workspaces:
        description: Optional whitespace-separated npm workspaces included in the production audit
        type: string
        default: ""
    secrets:
      package_read_token:
        description: Optional read-only token for private npm packages
        required: false

permissions:
  contents: read

jobs:
  quality:
    name: Next.js quality
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Install locked dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package_read_token }}
          LEGACY_PEER_DEPENDENCIES: ${{ inputs.legacy_peer_dependencies }}
        run: |
          if [[ "$LEGACY_PEER_DEPENDENCIES" == "true" ]]; then
            npm ci --legacy-peer-deps
          else
            npm ci
          fi

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run check-types

      - name: Audit production dependencies
        env:
          NPM_AUDIT_WORKSPACES: ${{ inputs.audit_workspaces }}
        run: |
          read -r -a workspaces <<< "$NPM_AUDIT_WORKSPACES"
          audit_args=()
          for workspace in "${workspaces[@]}"; do
            [[ "$workspace" =~ ^(@[a-z0-9._-]+/)?[a-z0-9._-]+$ ]]
            audit_args+=("--workspace=$workspace")
          done
          npm audit --audit-level=high --omit=dev "${audit_args[@]}"

      - name: Build
        run: npm run build
