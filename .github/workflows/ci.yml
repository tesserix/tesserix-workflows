name: CI

on:
  workflow_call:
    inputs:
      go_enabled:
        description: Run the Go quality workflow
        type: boolean
        default: false
      go_working_directory:
        type: string
        default: .
      go_version:
        type: string
        default: 1.26.x
      go_coverage_min_lines:
        type: number
        default: 70
      python_enabled:
        description: Run the Python quality workflow
        type: boolean
        default: false
      python_working_directory:
        type: string
        default: .
      python_version:
        type: string
        default: "3.13"
      python_uv_version:
        type: string
        default: 0.9.26
      python_source_directory:
        type: string
        default: src
      python_coverage_min_lines:
        type: number
        default: 70
      rust_enabled:
        description: Run the Rust quality workflow
        type: boolean
        default: false
      rust_working_directory:
        type: string
        default: .
      rust_toolchain:
        type: string
        default: stable
      rust_coverage_min_lines:
        type: number
        default: 70
      rust_coverage_ignore_regex:
        type: string
        default: tests?/
      rust_database_enabled:
        type: boolean
        default: false
      rust_database_image:
        type: string
        default: postgres:17-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
      rust_database_setup_script:
        type: string
        default: ""
      rust_database_environment_prefix:
        type: string
        default: TEST_DATABASE_
      nextjs_enabled:
        description: Run the Next.js quality workflow
        type: boolean
        default: false
      nextjs_working_directory:
        type: string
        default: .
      node_version:
        type: string
        default: "22"
      nextjs_legacy_peer_dependencies:
        description: Use npm's legacy peer dependency resolution with the lockfile
        type: boolean
        default: false
      nextjs_audit_workspaces:
        description: Optional whitespace-separated npm workspaces included in the production audit
        type: string
        default: ""
      expo_enabled:
        description: Run the Expo mobile quality workflow
        type: boolean
        default: false
      expo_working_directory:
        type: string
        default: apps/mobile
      expo_install_directory:
        type: string
        default: .
      expo_lockfile_path:
        type: string
        default: package-lock.json
      expo_node_version:
        type: string
        default: "22"
      expo_package_manager:
        type: string
        default: npm
      expo_pnpm_version:
        type: string
        default: 10.17.1
      expo_workspace_filter:
        type: string
        default: ""
      expo_legacy_peer_dependencies:
        type: boolean
        default: false
      expo_typed_routes_enabled:
        type: boolean
        default: true
      expo_format_enabled:
        type: boolean
        default: false
      expo_lint_enabled:
        type: boolean
        default: true
      expo_test_enabled:
        type: boolean
        default: true
      expo_audit_enabled:
        type: boolean
        default: true
      expo_audit_ci_version:
        type: string
        default: 7.1.0
      expo_audit_config_path:
        description: Optional repository-relative audit-ci JSON/JSONC config
        type: string
        default: ""
      expo_doctor_enabled:
        type: boolean
        default: true
      expo_doctor_version:
        type: string
        default: 1.20.2
      containers_enabled:
        description: Build, smoke-test, and scan the image matrix
        type: boolean
        default: false
      container_images:
        description: JSON matrix accepted by container-ci.yml
        type: string
        default: '{"include":[]}'
    secrets:
      package_read_token:
        description: Optional read-only token for private npm packages
        required: false
      container_registry_token:
        description: Optional token for private registry dependencies
        required: false
      container_package_read_token:
        description: Optional package token for container builds
        required: false
      container_application_build_secret:
        description: Optional protected application build input
        required: false
      container_public_build_arg_1:
        description: Optional public container build value 1
        required: false
      container_public_build_arg_2:
        description: Optional public container build value 2
        required: false
      container_public_build_arg_3:
        description: Optional public container build value 3
        required: false
      container_public_build_arg_4:
        description: Optional public container build value 4
        required: false
      container_public_build_arg_5:
        description: Optional public container build value 5
        required: false
      container_public_build_arg_6:
        description: Optional public container build value 6
        required: false
      container_public_build_arg_7:
        description: Optional public container build value 7
        required: false
      container_public_build_arg_8:
        description: Optional public container build value 8
        required: false

permissions:
  contents: read

jobs:
  go:
    name: Go
    if: ${{ inputs.go_enabled }}
    uses: ./.github/workflows/go-ci.yml
    with:
      working_directory: ${{ inputs.go_working_directory }}
      go_version: ${{ inputs.go_version }}
      coverage_min_lines: ${{ inputs.go_coverage_min_lines }}

  python:
    name: Python
    if: ${{ inputs.python_enabled }}
    uses: ./.github/workflows/python-ci.yml
    with:
      working_directory: ${{ inputs.python_working_directory }}
      python_version: ${{ inputs.python_version }}
      uv_version: ${{ inputs.python_uv_version }}
      source_directory: ${{ inputs.python_source_directory }}
      coverage_min_lines: ${{ inputs.python_coverage_min_lines }}

  rust:
    name: Rust
    if: ${{ inputs.rust_enabled }}
    uses: ./.github/workflows/rust-ci.yml
    with:
      working_directory: ${{ inputs.rust_working_directory }}
      toolchain: ${{ inputs.rust_toolchain }}
      coverage_min_lines: ${{ inputs.rust_coverage_min_lines }}
      coverage_ignore_regex: ${{ inputs.rust_coverage_ignore_regex }}
      database_enabled: ${{ inputs.rust_database_enabled }}
      database_image: ${{ inputs.rust_database_image }}
      database_setup_script: ${{ inputs.rust_database_setup_script }}
      database_environment_prefix: ${{ inputs.rust_database_environment_prefix }}

  nextjs:
    name: Next.js
    if: ${{ inputs.nextjs_enabled }}
    uses: ./.github/workflows/nextjs-ci.yml
    with:
      working_directory: ${{ inputs.nextjs_working_directory }}
      node_version: ${{ inputs.node_version }}
      legacy_peer_dependencies: ${{ inputs.nextjs_legacy_peer_dependencies }}
      audit_workspaces: ${{ inputs.nextjs_audit_workspaces }}
    secrets:
      package_read_token: ${{ secrets.package_read_token }}

  expo:
    name: Expo
    if: ${{ inputs.expo_enabled }}
    uses: ./.github/workflows/expo-ci.yml
    with:
      working_directory: ${{ inputs.expo_working_directory }}
      install_directory: ${{ inputs.expo_install_directory }}
      lockfile_path: ${{ inputs.expo_lockfile_path }}
      node_version: ${{ inputs.expo_node_version }}
      package_manager: ${{ inputs.expo_package_manager }}
      pnpm_version: ${{ inputs.expo_pnpm_version }}
      workspace_filter: ${{ inputs.expo_workspace_filter }}
      legacy_peer_dependencies: ${{ inputs.expo_legacy_peer_dependencies }}
      typed_routes_enabled: ${{ inputs.expo_typed_routes_enabled }}
      format_enabled: ${{ inputs.expo_format_enabled }}
      lint_enabled: ${{ inputs.expo_lint_enabled }}
      test_enabled: ${{ inputs.expo_test_enabled }}
      audit_enabled: ${{ inputs.expo_audit_enabled }}
      audit_ci_version: ${{ inputs.expo_audit_ci_version }}
      audit_config_path: ${{ inputs.expo_audit_config_path }}
      doctor_enabled: ${{ inputs.expo_doctor_enabled }}
      expo_doctor_version: ${{ inputs.expo_doctor_version }}
    secrets:
      package_read_token: ${{ secrets.package_read_token }}

  containers:
    name: Containers
    if: ${{ inputs.containers_enabled }}
    uses: ./.github/workflows/container-ci.yml
    with:
      images: ${{ inputs.container_images }}
    secrets:
      registry_token: ${{ secrets.container_registry_token }}
      package_read_token: ${{ secrets.container_package_read_token }}
      application_build_secret: ${{ secrets.container_application_build_secret }}
      public_build_arg_1: ${{ secrets.container_public_build_arg_1 }}
      public_build_arg_2: ${{ secrets.container_public_build_arg_2 }}
      public_build_arg_3: ${{ secrets.container_public_build_arg_3 }}
      public_build_arg_4: ${{ secrets.container_public_build_arg_4 }}
      public_build_arg_5: ${{ secrets.container_public_build_arg_5 }}
      public_build_arg_6: ${{ secrets.container_public_build_arg_6 }}
      public_build_arg_7: ${{ secrets.container_public_build_arg_7 }}
      public_build_arg_8: ${{ secrets.container_public_build_arg_8 }}

  secrets:
    name: Secrets
    uses: ./.github/workflows/secret-scan.yml

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [go, python, rust, nextjs, expo, containers, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Refuse failed or cancelled capabilities
        env:
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
        run: |
          test "$HAS_CANCELLED" = false
          test "$HAS_FAILURE" = false
