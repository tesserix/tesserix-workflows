name: Vehicle Rental CI

on:
  workflow_call:
    secrets:
      package_read_token:
        description: Read-only token for private Tesserix npm packages
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust — fmt, clippy, audit, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:0a23a2b5e4fbd9b4c6980d20ee80dd6b63dec52669379c75a506db58a4116708
        env:
          POSTGRES_PASSWORD: local
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install the Rust toolchain
        run: rustup toolchain install 1.97 --profile minimal --component rustfmt,clippy && rustup default 1.97

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install coverage tooling
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-llvm-cov

      - name: Install dependency auditing
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-features

      - name: Enforce module boundaries
        run: cargo test --workspace --test boundaries

      - name: Audit dependencies
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Load the integration-test schema
        env:
          PGPASSWORD: local
        run: |
          chmod +x scripts/test-db.sh
          scripts/test-db.sh >> "$GITHUB_ENV"

      - name: Test with coverage
        env:
          PGPASSWORD: local
        run: |
          cargo llvm-cov --workspace --all-features \
            --ignore-filename-regex '(tests?/|/api\.rs$)' \
            --fail-under-lines 52 \
            -- --include-ignored

  web:
    name: Web — format, lint, audit, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package_read_token }}
        run: npm ci

      - name: Format
        run: npx prettier --check "apps/**/*.{ts,tsx,css}" "packages/**/*.{ts,tsx,css}"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run check-types

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Build
        run: npm run build

  containers:
    name: Container — ${{ matrix.image }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vehicle-rental-api
            dockerfile: docker/api.Dockerfile
            app: ''
          - image: vehicle-rental-storefront
            dockerfile: docker/web.Dockerfile
            app: storefront
          - image: vehicle-rental-admin
            dockerfile: docker/web.Dockerfile
            app: admin
          - image: vehicle-rental-onboarding
            dockerfile: docker/web.Dockerfile
            app: onboarding
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          build-args: |
            APP=${{ matrix.app }}
          tags: local/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=pr-${{ matrix.image }}
          cache-to: type=gha,scope=pr-${{ matrix.image }},mode=max

      - name: Smoke test the web image
        if: matrix.app != ''
        env:
          IMAGE_REF: local/${{ matrix.image }}:${{ github.sha }}
        run: |
          container_id=$(docker run --detach --rm --publish 3000:3000 "$IMAGE_REF")
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 1 \
            --retry-max-time 30 --fail --silent --show-error --output /dev/null \
            http://127.0.0.1:3000/healthz

      - name: Scan the release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tgz

      - name: Scan committed content
        run: gitleaks dir . --no-banner --redact
