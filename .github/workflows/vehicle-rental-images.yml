name: Vehicle Rental Images

on:
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release-guard:
    name: Require main
    runs-on: ubuntu-latest
    steps:
      - name: Refuse releases outside main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main

  build:
    name: Build — ${{ matrix.image }}
    needs: release-guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vehicle-rental-api
            dockerfile: docker/api.Dockerfile
            app: ''
          - image: vehicle-rental-storefront
            dockerfile: docker/web.Dockerfile
            app: storefront
          - image: vehicle-rental-admin
            dockerfile: docker/web.Dockerfile
            app: admin
          - image: vehicle-rental-onboarding
            dockerfile: docker/web.Dockerfile
            app: onboarding
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build, attest, and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            APP=${{ matrix.app }}
          tags: |
            ghcr.io/tesserix/${{ matrix.image }}:main-${{ steps.sha.outputs.short }}
            ghcr.io/tesserix/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          sbom: true
          provenance: mode=max

      - name: Smoke test the web image
        if: matrix.app != ''
        env:
          IMAGE_REF: ghcr.io/tesserix/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE_REF"
          container_id=$(docker run --detach --rm --publish 3000:3000 "$IMAGE_REF")
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 1 \
            --retry-max-time 30 --fail --silent --show-error --output /dev/null \
            http://127.0.0.1:3000/healthz

      - name: Scan the published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/tesserix/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/tesserix/${{ matrix.image }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
