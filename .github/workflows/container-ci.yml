name: Container CI

on:
  workflow_call:
    inputs:
      images:
        description: JSON matrix with name, context, dockerfile, build_args, smoke_port, and smoke_path
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Container — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Validate image contract
        env:
          IMAGE_NAME: ${{ matrix.name }}
          SMOKE_PATH: ${{ matrix.smoke_path }}
          SMOKE_PORT: ${{ matrix.smoke_port }}
        run: |
          [[ "$IMAGE_NAME" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          [[ "$SMOKE_PORT" =~ ^[0-9]+$ ]]
          [[ "$SMOKE_PATH" == /* && "$SMOKE_PATH" != *[[:space:]]* ]]

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          build-args: ${{ matrix.build_args }}
          tags: local/ci-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=pr-${{ matrix.name }}
          cache-to: type=gha,scope=pr-${{ matrix.name }},mode=max

      - name: Smoke test image
        if: ${{ matrix.smoke_port != 0 }}
        env:
          IMAGE_REF: local/ci-${{ matrix.name }}:${{ github.sha }}
          SMOKE_PATH: ${{ matrix.smoke_path }}
          SMOKE_PORT: ${{ matrix.smoke_port }}
        run: |
          container_id=$(docker run --detach --rm --publish "$SMOKE_PORT:$SMOKE_PORT" "$IMAGE_REF")
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 1 \
            --retry-max-time 30 --fail --silent --show-error --output /dev/null \
            "http://127.0.0.1:${SMOKE_PORT}${SMOKE_PATH}"

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/ci-${{ matrix.name }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
